<script type="text/babel">
const VERS=[['v1','01 · Enterprise — navy hero, spec panel, card grid',V1],['v2','02 · Editorial index — sticky contents, accordion services',V2],['v3','03 · Immersive field — full-bleed photo, frosted layers, service rail',V3],['v4','04 · Spec sheet — bento tiles, voltage scale, data table',V4],['v5','05 · Conversion-led — hero form, ECD stage stepper, tabs',V5]];
const HOMES=[['hA','A · Orbit — flat navy field, 3D ring system, tilt cards',HomeA]];
function Measure({onH,children}){
  const ref=React.useRef(null);
  React.useEffect(()=>{const el=ref.current;const ro=new ResizeObserver(()=>onH(Math.ceil(el.offsetHeight)));ro.observe(el);return()=>ro.disconnect();},[]);
  return <div ref={ref}>{children}</div>;
}
const TWEAK_DEFAULTS=/*EDITMODE-BEGIN*/{
  "green": "#D0D407",
  "showRef": false,
  "heroVis": "spec"
}/*EDITMODE-END*/;
const darken=(hex,f)=>'#'+[1,3,5].map(i=>Math.round(parseInt(hex.slice(i,i+2),16)*f).toString(16).padStart(2,'0')).join('');
function App(){
  const [h,setH]=React.useState({});
  const [t,setTweak]=useTweaks(TWEAK_DEFAULTS);
  React.useEffect(()=>{const r=document.documentElement.style;r.setProperty('--t3-green',t.green);r.setProperty('--button-bg',t.green);r.setProperty('--button-bg-hover',darken(t.green,.9));r.setProperty('--button-bg-press',darken(t.green,.8));},[t.green]);
  return <><TweaksPanel><TweakSection label="Brand"/><TweakColor label="Green" value={t.green} options={['#DFCD02','#D0D407','#B8E04A','#37C6C0']} onChange={v=>setTweak('green',v)}/><TweakSection label="Option 2 hero"/><TweakSelect label="Hero visual" value={t.heroVis} options={[{value:'collage',label:'Photo collage'},{value:'spec',label:'Photo + frosted spec bar'},{value:'strips',label:'Staggered strips'},{value:'inset',label:'Photo + inset'}]} onChange={v=>setTweak('heroVis',v)}/><TweakSection label="Canvas"/><TweakToggle label="Show reference" value={t.showRef} onChange={v=>setTweak('showRef',v)}/></TweaksPanel><DesignCanvas>
    {t.showRef&&<DCSection id="ref" title="Reference"><DCArtboard id="hRef" label="Reference — screenshot" width={728} height={3528}><img src="assets/home-reference.png" alt="Homepage reference screenshot" style={{display:'block',width:'100%',height:'auto'}}></img></DCArtboard></DCSection>}
    {[['home','Home','hA',HomeA],['de','Delivery Engineering','v1',V1],['env','Environmental','env1',EnvPage],['dist','Distribution Engineering','dist1',DistV1],['about','About','ab1',AboutPage],['ct','Contact','ct1',ContactA]].map(([p,l,did,C])=><DCSection key={p} id={'pg-'+p} title={l} subtitle="Desktop 1440px · Tablet 834px · Phone 390px">
      {[[did,'Desktop',1440],['tab-'+p,'Tablet',834],['ph-'+p,'Phone',390]].map(([id,T,W])=><DCArtboard key={id} id={id} label={l+' — '+T} width={W} height={h[id]||(W>1000?6000:8000)}><Measure onH={v=>setH(q=>q[id]===v?q:{...q,[id]:v})}>{p==='de'?<C heroVis={t.heroVis}/>:<C/>}</Measure></DCArtboard>)}
    </DCSection>)}
  </DesignCanvas></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
