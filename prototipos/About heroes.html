function Measure({onH,children}){const ref=React.useRef(null);React.useEffect(()=>{const el=ref.current;const ro=new ResizeObserver(()=>onH(Math.ceil(el.offsetHeight)));ro.observe(el);return()=>ro.disconnect();},[]);return <div ref={ref}>{children}</div>;}
function App(){const [h,setH]=React.useState({});
  return <DesignCanvas>{AB_HEROES.map(([id,l,C])=><DCSection key={id} id={id} title={l} subtitle="Desktop 1440 · Tablet 834 · Phone 390">
    {[['d','Desktop',1440],['t','Tablet',834],['p','Phone',390]].map(([k,T,W])=>{const aid=id+k;return <DCArtboard key={aid} id={aid} label={l+' — '+T} width={W} height={h[aid]||900}><Measure onH={v=>setH(q=>q[aid]===v?q:{...q,[aid]:v})}><div className="de-page"><SiteHeader tone={id==='h4'?'light':'navy'} active={2}/><C/></div></Measure></DCArtboard>;})}
  </DCSection>)}</DesignCanvas>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
