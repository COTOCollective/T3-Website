<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery Engineering | T3 Consulting</title>
<link rel="stylesheet" href="_ds/t3-consulting-design-system-2ce685c9-7b2a-449f-b3d0-342d9cf8fb20/tokens/fonts.css">
<link rel="stylesheet" href="_ds/t3-consulting-design-system-2ce685c9-7b2a-449f-b3d0-342d9cf8fb20/tokens/colors.css">
<link rel="stylesheet" href="_ds/t3-consulting-design-system-2ce685c9-7b2a-449f-b3d0-342d9cf8fb20/tokens/typography.css">
<link rel="stylesheet" href="_ds/t3-consulting-design-system-2ce685c9-7b2a-449f-b3d0-342d9cf8fb20/tokens/spacing.css">
<link rel="stylesheet" href="_ds/t3-consulting-design-system-2ce685c9-7b2a-449f-b3d0-342d9cf8fb20/styles.css">
<link rel="stylesheet" href="src/de.css">
<style>a{color:var(--text-link)}a:hover{color:var(--t3-navy)}html{scroll-behavior:smooth}
.vswitch{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--surface-frost-strong);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--surface-frost-border);box-shadow:var(--shadow-lg)}
.vswitch button{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;font:600 12px/16px var(--font-display);letter-spacing:.06em;color:#fff;white-space:nowrap}
.vswitch button:hover{background:rgba(255,255,255,.1)}.vswitch button.on{background:var(--accent);color:var(--t3-navy)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/t3-consulting-design-system-2ce685c9-7b2a-449f-b3d0-342d9cf8fb20/_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="src/de-shared.jsx"></script>
<script type="text/babel" src="src/de-v1.jsx"></script>
<script type="text/babel" src="src/de-v2.jsx"></script>
<script type="text/babel" src="src/de-v3.jsx"></script>
<script type="text/babel" src="src/de-v4.jsx"></script>
<script type="text/babel" src="src/de-v5.jsx"></script>
<script type="text/babel" src="src/de-v6.jsx"></script>
<script type="text/babel">
const VERS=[['01','Enterprise',V1],['02','Editorial',V2],['03','Immersive',V3],['04','Spec sheet',V4],['05','Conversion',V5],['06','Reference',V6]];
function App(){
  const q=new URLSearchParams(location.search).get('v');
  const [v,setV]=React.useState(()=>{const n=+(q||localStorage.getItem('de-version')||1);return n>=1&&n<=6?n-1:0;});
  React.useEffect(()=>{localStorage.setItem('de-version',v+1);},[v]);
  const C=VERS[v][2];
  return <>
    <C key={v}/>
    <div className="vswitch" role="tablist">{VERS.map(([n,l],i)=><button key={n} className={i===v?'on':''} onClick={()=>{setV(i);window.scrollTo(0,0);}}>{n}<span className="de-hide-sm"> · {l}</span></button>)}</div>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
