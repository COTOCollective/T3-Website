<style>a{color:var(--text-link)}a:hover{color:var(--t3-navy)}.v6-more-dot{flex:none}
.pg-switch{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:100;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(12,40,52,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow-lg);max-width:calc(100vw - 24px);overflow-x:auto}
.pg-switch button{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;font:600 12px/16px var(--font-body);color:rgba(255,255,255,.75);white-space:nowrap}
.pg-switch button.on{background:var(--accent);color:var(--t3-navy)}
.vp-stage{min-height:100vh;background:#E6ECEF;padding:32px 0 96px;display:flex;justify-content:center}.vp-frame{background:#fff;box-shadow:var(--shadow-lg);border-radius:20px;overflow:hidden;transform:translateZ(0)}.vp-frame .de-page{min-height:100%}
@media print{.pg-switch{display:none}}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</head><body>
<div id="root"></div>
<script type="text/babel" src="src/tweaks-panel.jsx"></script>
<script type="text/babel" src="src/de-shared.jsx"></script>
<script type="text/babel" src="src/de-v1.jsx"></script>
<script type="text/babel" src="src/de-v6.jsx"></script>
<script type="text/babel" src="src/env-v1.jsx"></script>
<script type="text/babel" src="src/dist-shared.jsx"></script>
<script type="text/babel" src="src/dist-v1.jsx"></script>
<script type="text/babel" src="src/home-shared.jsx"></script>
<script type="text/babel" src="src/home-heroes.jsx"></script>
<script type="text/babel" src="src/home-c.jsx"></script>
<script type="text/babel" src="src/home-d.jsx"></script>
<script type="text/babel" src="src/home-ecd.jsx"></script>
<script type="text/babel" src="src/home-proof.jsx"></script>
<script type="text/babel" src="src/home-a.jsx"></script>
<script type="text/babel" src="src/contact.jsx"></script>
<script type="text/babel">
const PAGES=[['home','Home',HomeA],['delivery','Delivery Engineering',V1],['environmental','Environmental',EnvPage],['distribution','Distribution',DistV1],['contact','Contact',ContactA]];
const VIEWS={phone:390,tablet:834,desktop:null};
const TWEAK_DEFAULTS=/*EDITMODE-BEGIN*/{
  "view": "desktop"
}/*EDITMODE-END*/;
function Site(){
  const [t,setTweak]=useTweaks(TWEAK_DEFAULTS);
  const get=()=>{const k=location.hash.slice(1);return PAGES.find(p=>p[0]===k)?k:'home';};
  const [k,setK]=React.useState(get);
  React.useEffect(()=>{const f=()=>{setK(get());window.scrollTo(0,0);};window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f);},[]);
  const C=PAGES.find(p=>p[0]===k)[2];
  const w=VIEWS[t.view];
  window.DE_STATIC=!!w;
  const page=<C key={k+t.view}/>;
  return <>
    {w?<div className="vp-stage"><div className="vp-frame" style={{width:w,maxWidth:'calc(100vw - 24px)'}}>{page}</div></div>:page}
    <nav className="pg-switch" aria-label="Pages">{PAGES.map(([id,l])=><button key={id} className={id===k?'on':''} onClick={()=>{location.hash=id;}}>{l}</button>)}</nav>
    <TweaksPanel><TweakSection label="Viewport"/><TweakRadio label="View" value={t.view} options={[{value:'phone',label:'Phone'},{value:'tablet',label:'Tablet'},{value:'desktop',label:'Desktop'}]} onChange={v=>setTweak('view',v)}/></TweaksPanel>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site/>);
</script>
</body></html>
